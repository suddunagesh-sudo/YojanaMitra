name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and List Files
        run: |
          echo "Files in repo before unzip:"
          ls -la
          unzip -o -q YojanaMitra-AndroidStudio-Project.zip
          echo "After unzip - full list:"
          ls -R | head -n 300
          echo "Searching gradlew:"
          find . -name "gradlew*" -type f
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew NOT FOUND - checking structure"
            find . -type f | head -n 100
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YojanaMitra-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
