name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Build
        run: |
          unzip -o -q YojanaMitra-AndroidStudio-Project.zip
          ls
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -1)
          echo "Found gradlew at $GRADLEW"
          DIR=$(dirname "$GRADLEW")
          echo "Building in $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --info
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YojanaMitra-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
